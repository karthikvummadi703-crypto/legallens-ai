[project]
name = "legallens-ai"
version = "1.0.0"
description = "LegalLens AI — legal document analysis, RAG chat and Ask LegalLens backend, deployed as a single FastAPI serverless function."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "firebase-admin>=6.5.0",
    "google-genai>=0.1.1",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[tool.vercel]
entrypoint = "main:app"

[tool.vercel.scripts]
build = "npm ci && npm run build && python scripts/assemble_public.py"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "B904", "B905"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["E402"]  # sys.path insertion in conftest happens before imports